<!DOCTYPE html>
<html>

<head>

<title>Nike Store</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/nike_store.css') }}">

</head>

<body>

<h1 class="title">
👟 Nike Store Products
</h1>

<div class="container">

{% for product in products %}

<div class="card">

<img src="{{ product.image }}">

<h2>{{ product.name }}</h2>

<p><b>Category:</b> {{ product.category }}</p>

<p><b>Price:</b> {{ product.price }}</p>

</div>

{% endfor %}

</div>

</body>

</html>
